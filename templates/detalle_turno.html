{% extends 'turno_base.html' %}

{% block subcontent %}
<div class="ucatolica-layout-wrapper animate__animated animate__fadeIn">

    <div class="profile-layout-container">

        <div class="action-top-right">
            {% if turno.activo %}
                <button onclick="ejecutarAccionTurno('/turno/{{ turno.id }}', 'DELETE')" class="btn-action btn-delete">
                    <i class="fa-solid fa-calendar-minus"></i> Finalizar Turno
                </button>
            {% else %}
                <button onclick="ejecutarAccionTurno('/turno/rehabilitar/{{ turno.id }}', 'PATCH')" class="btn-action btn-reactivate">
                    <i class="fa-solid fa-arrows-rotate"></i> Reactivar Turno
                </button>
            {% endif %}
        </div>

        <div class="profile-card-wrapper">
            {% include 'turno_card.html' %}
        </div>

        <div class="action-bottom-left">
            <a href="/turno/editar/{{ turno.id }}" class="btn-action btn-edit">
                <i class="fa-solid fa-user-pen"></i> Editar Turno
            </a>
        </div>

    </div>
</div>

<style>
    /* Diseño global centrado e independiente de clases que rompan el contenedor principal */
    .ucatolica-layout-wrapper {
        width: 100%;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        box-sizing: border-box;
    }

    /* Contenedor centralizado para la tarjeta de detalle */
    .profile-layout-container {
        position: relative;
        background: #ffffff !important;
        border-radius: 16px !important;
        border: 1px solid #e2e8f0 !important;
        padding: 40px !important;
        width: 100% !important;
        max-width: 450px !important; /* Mismo ancho controlado */
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05) !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: 20px !important;
        box-sizing: border-box;
    }

    /* Ajustes específicos para incrustar el turno_card.html de forma homogénea */
    .profile-card-wrapper {
        width: 100% !important;
        margin-top: 35px !important; /* Espacio superior prudente para los botones dinámicos */
    }

    .profile-card-wrapper .turno-card-container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 !important;
    }

    .profile-card-wrapper .turno-card {
        box-shadow: none !important; /* Remueve dobles sombras innecesarias */
        border: 1px solid #f1f5f9 !important;
        border-top: 4px solid var(--ucatolica-blue, #004b87) !important;
    }

    /* Ubicación exacta arriba a la derecha */
    .action-top-right {
        position: absolute !important;
        top: 20px !important;
        right: 20px !important;
        display: flex !important;
        gap: 10px !important;
        z-index: 10 !important;
    }

    /* Ubicación abajo a la izquierda */
    .action-bottom-left {
        width: 100% !important;
        display: flex !important;
        justify-content: flex-start !important;
        margin-top: 10px !important;
    }

    /* Estilos base compartidos de los botones de acción */
    .btn-action {
        padding: 10px 16px !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        border-radius: 8px !important;
        border: none !important;
        cursor: pointer !important;
        display: inline-flex !important;
        align-items: center !important;
        gap: 8px !important;
        transition: all 0.2s ease !important;
        text-decoration: none !important;
    }

    /* Botón Finalizar Turno (Simula el Delete semántico del sistema) */
    .btn-delete {
        background-color: #fee2e2 !important;
        color: #dc2626 !important;
    }
    .btn-delete:hover {
        background-color: #dc2626 !important;
        color: #ffffff !important;
    }

    /* Botón Reactivar Turno */
    .btn-reactivate {
        background-color: #dcfce7 !important;
        color: #16a34a !important;
    }
    .btn-reactivate:hover {
        background-color: #16a34a !important;
        color: #ffffff !important;
    }

    /* Botón Editar Configuración */
    .btn-edit {
        background-color: #e0f2fe !important;
        color: #0369a1 !important;
    }
    .btn-edit:hover {
        background-color: #004b87 !important;
        color: #ffffff !important;
    }
</style>

<script>
    async function ejecutarAccionTurno(url, metodo) {
        const confirmacion = confirm(`¿Está seguro de realizar esta acción sobre el turno seleccionado?`);
        if (!confirmacion) return;

        try {
            const response = await fetch(url, {
                method: metodo,
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (response.ok) {
                alert("El estado del turno ha sido actualizado.");
                // Redireccionamos a la lista completa de turnos en el sistema
                window.location.href = "/turnos";
            } else {
                const errorData = await response.json();
                alert(`Error: ${errorData.detail || 'No se pudo completar la solicitud de actualización.'}`);
            }
        } catch (error) {
            console.error("Error en la transacción AJAX:", error);
            alert("Ocurrió un problema de conectividad con el servidor.");
        }
    }
</script>
{% endblock %}
